name: reelriot
description: A new Flutter project.

publish_to: "none"

version: 2026.09.21+142
environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  animated_text_kit: ^4.2.1
  media_kit:
    path: ../media-kit/media_kit
  media_kit_video:
    path: ../media-kit/media_kit_video
  media_kit_libs_android_video:
    path: ../media-kit/libs/android/media_kit_libs_android_video
  cached_network_image: ^3.2.2
  carousel_slider: ^5.1.1
  cast_plus: ^2.2.0
  clipboard: ^2.0.2
  connectivity_plus: ^6.1.5
  cupertino_icons: ^1.0.2
  device_info_plus: ^13.0.0
  dio: ^5.9.0
  easy_localization: ^3.0.2
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.3.0
  flutter_colorpicker: ^1.0.3
  flutter_dotenv: ^6.0.0
  flutter_download_manager: ^0.5.4
  flutter_downloader: ^1.12.1
  flutter_spinkit: ^5.1.0
  startapp_sdk: ^1.0.1
  flutter_svg: ^2.0.9
  font_awesome_flutter: ^11.0.0
  get: ^4.6.6
  google_fonts: ^6.3.1
  google_nav_bar: ^5.0.6
  google_sign_in: ^7.1.1
  http: ^1.1.0
  intl: ^0.20.2
  open_file: ^3.5.11
  path_provider: ^2.1.2
  percent_indicator: ^4.2.3
  permission_handler: ^12.0.1
  photo_view: ^0.15.0
  provider: ^6.0.3
  readmore: ^3.0.0
  retry: ^3.1.1
  share_plus: ^13.0.0
  shared_preferences: ^2.0.15
  shimmer: ^3.0.0
  sqflite: ^2.2.8
  supabase_flutter: ^2.3.2
  url_launcher: ^6.1.6
  username_generator: ^1.3.0
  wakelock_plus: ^1.7.0
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.13.0
  mixpanel_flutter: ^2.13.0
  flutter_secure_storage: ^10.0.0
  flutter_app_installer: ^2.0.0
  crypto: ^3.0.7
dependency_overrides:
  media_kit:
    path: ../media-kit/media_kit
  media_kit_video:
    path: ../media-kit/media_kit_video
  media_kit_libs_android_video:
    path: ../media-kit/libs/android/media_kit_libs_android_video

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  xml: ^6.5.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.jpg"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/
    - assets/ca/
    - assets/translations/
    - assets/images/
    - assets/images/simulated/
    - assets/images/profiles/
    - assets/images/country_flags/
    - assets/icons/
    - assets/Bold/
    - assets/default_google_pay_config.json

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins/Poppins-Regular.ttf
    - family: PoppinsBold
      fonts:
        - asset: assets/fonts/Poppins/Poppins-Bold.ttf
    - family: PoppinsSB
      fonts:
        - asset: assets/fonts/Poppins/Poppins-SemiBold.ttf
    - family: SocialIcons
      fonts:
        - asset: assets/fonts/SocialIcons.ttf
    - family: IMdb
      fonts:
        - asset: assets/fonts/imdb.ttf
